<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <div class = "main__list">
        <div class = "sidebar__list">
            <div class="sidebar__list-newList">
                <form class="sidebar__list-form">
                    <input type="text" class="sidebar__list-input" placeholder="Nueva tarea...">
                    <button type="submit" class="sidebar__list-sumitButton" data-valor="agregar">+</button>
                </form>
                <ul class="sidebar__list-items">
                </ul>
            </div>
        </div>
        <div class="main__list-showed">
            <div class="main__list-title">
                <input type="text" class="main__list-title-input" placeholder="Ingrese el Titulo de la tarea...">
            </div>
            <div class="main__list-description">
                <textarea class="main__list-description-textarea" placeholder="Escribe la descripcion de la tarea..."></textarea>
            </div>
        </div>
    </div>
    <script src="script.js" defer></script>
</body>
</html>
