<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="script.js">
    <title>Calculadora</title>
</head>
<body>
    <div class="calc__box">
        <div class="calc__box-result">
            <input type="text" class="calc__box-result" >
        </div>
        <div class="calc__box-operations">
            <div class="calc__box-valor">/</div>
            <div class="calc__box-valor">*</div>
            <div class="calc__box-valor">-</div>
            <div class="calc__box-valor">+</div>
        </div>
        <div class="calc__box-numbers">
            <div class="calc__box-valor">9</div>
            <div class="calc__box-valor">8</div>
            <div class="calc__box-valor">7</div>
            <div class="calc__box-valor">6</div>
            <div class="calc__box-valor">5</div>
            <div class="calc__box-valor">4</div>
            <div class="calc__box-valor">3</div>
            <div class="calc__box-valor">2</div>
            <div class="calc__box-valor">1</div>
            <div class="calc__box-valor">.</div>
            <div class="calc__box-valor">0</div>
            <div class="calc__box-valor">=</div>
        </div>
    </div>
</body>
</html>
